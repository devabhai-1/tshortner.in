<!DOCTYPE html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Viewport - Mobile & Desktop Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- Primary Meta Tags -->
    <title>TShortner — URL Shortener &amp; Earning Panel</title>
    <meta name="title" content="TShortner — URL Shortener &amp; Earning Panel" />
    <meta name="description" content="TShortner: short links, live stats, and wallet — ek panel se manage karo." />
    <meta name="keywords" content="tshortner, url shortener, link shortener, short links, earning panel" />
    <meta name="author" content="TShortner" />
    <meta name="robots" content="index, follow" />
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0084FF" />
    <meta name="msapplication-TileColor" content="#0084FF" />
    <meta name="msapplication-TileImage" content="/icon-144x144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph / Facebook / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TShortner — URL Shortener &amp; Earning Panel" />
    <meta property="og:description" content="Short links, live stats, and wallet — ek panel se." />
    <meta property="og:site_name" content="TShortner" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TShortner — URL Shortener &amp; Earning Panel" />
    <meta name="twitter:description" content="Short links, live stats, and wallet — ek panel se." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TShortner" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TShortner" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Performance Optimization - Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch for External Resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Disable Auto Translate (Optional) -->
    <meta name="google" content="notranslate" />
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      /* Prevent Flash of Unstyled Content */
      body {
        margin: 0;
        padding: 0;
        background-color: #0f0f1e;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      #root {
        min-height: 100vh;
        width: 100%;
      }
      
      /* Loading State */
      .loading-screen {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; color: #fff; background: #1a1a2e;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use this application.</p>
      </div>
    </noscript>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
