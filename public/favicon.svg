<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Blue Squircle Icon -->
  <rect x="35" y="186" width="140" height="140" rx="32" fill="#0084FF"/>

  <!-- White Link Icon inside Blue Box -->
  <g transform="translate(105, 256) rotate(-45)">
    <!-- Top Right Loop -->
    <path d="M -10,-25 H 32 A 25,25 0 0,1 32,25 H -10" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Left Loop -->
    <path d="M 10,25 H -32 A 32,32 0 0,1 -32,-25 H 10" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Middle Link Line -->
    <line x1="-22" y1="0" x2="22" y2="0" 
          stroke="#FFFFFF" 
          stroke-width="18" 
          stroke-linecap="round"/>
  </g>

  <!-- Brand Text: TeraBox Shortener -->
  <text x="198" y="235" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="46" font-weight="800" fill="#000000">TeraBox</text>
  <text x="198" y="298" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="46" font-weight="800" fill="#000000">Shortener</text>
</svg>
